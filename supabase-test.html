<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supabase Connection Test</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px}pre{background:#f4f4f4;padding:14px;border-radius:8px;white-space:pre-wrap}.ok{color:green}.bad{color:#b00020}</style></head><body><h1>ViviChild Supabase Test</h1><div id="out">Testing…</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js?v=20260815"></script><script>(async()=>{const o=document.getElementById('out'),c=window.SUPABASE_CONFIG||{};if(!c.url||!c.anonKey||String(c.url).includes('YOUR_')||String(c.anonKey).includes('YOUR_')){o.innerHTML='<p class="bad"><strong>Not configured.</strong></p><pre>Open assets/js/supabase-config.js and replace the two placeholders.</pre>';return}try{const sb=supabase.createClient(c.url,c.anonKey);const {data,error}=await sb.from('site_settings').select('id').eq('id',1).maybeSingle();if(error)throw error;o.innerHTML='<p class="ok"><strong>Supabase connection works.</strong></p><pre>Project: '+c.url+'\nsite_settings row: '+JSON.stringify(data)+'</pre>'}catch(e){o.innerHTML='<p class="bad"><strong>Supabase connected, but the database request failed.</strong></p><pre>'+JSON.stringify(e,null,2)+'</pre>'}})();</script></body></html>
