<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViviChild Supabase Test</title>
<style>
body{font-family:Arial,sans-serif;max-width:850px;margin:35px auto;padding:20px;color:#263238}
pre{background:#f4f6f8;padding:14px;border-radius:8px;white-space:pre-wrap;overflow:auto}
.ok{color:#087f23}.bad{color:#b00020}.warn{color:#9a6700}.box{border:1px solid #ddd;border-radius:12px;padding:18px;margin:14px 0}
code{background:#f1f3f5;padding:2px 5px;border-radius:4px}
</style></head>
<body>
<h1>ViviChild Supabase Test</h1>
<div id="out">Testing…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=20260815"></script>
<script>
(async()=>{
 const out=document.getElementById('out'), c=window.SUPABASE_CONFIG||{};
 const show=(cls,title,text)=>out.innerHTML='<div class="box"><h2 class="'+cls+'">'+title+'</h2><pre>'+String(text).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre></div>';
 if(!c.url||!c.anonKey||String(c.url).includes('YOUR_')||String(c.anonKey).includes('YOUR_')){
   show('bad','Supabase is not configured','Open assets/js/supabase-config.js and replace YOUR_SUPABASE_PROJECT_URL and YOUR_SUPABASE_ANON_KEY.');
   return;
 }
 if(/\/(rest\/v1|auth\/v1|storage\/v1)(\/|$)/i.test(c.url)){
   show('bad','Wrong Supabase URL','Use only the Project URL, for example:\\nhttps://xxxxxxxxxxxxxxxx.supabase.co\\nDo not include /rest/v1, /auth/v1 or /storage/v1.');
   return;
 }
 try{
   const sb=window.supabase.createClient(c.url,c.anonKey);
   const {data,error}=await sb.from('site_settings').select('id').eq('id',1).maybeSingle();
   if(error){
     let advice='Database request failed.\\n\\nCode: '+(error.code||'')+'\\nMessage: '+(error.message||'');
     if(error.code==='PGRST125') advice+='\\n\\nPGRST125 usually means the configured Project URL is not the Supabase Project URL. Check Supabase Dashboard → Project Settings → API → Project URL.';
     else if(error.code==='42P01') advice+='\\n\\nThe site_settings table does not exist. Run supabase_schema.sql in Supabase SQL Editor.';
     else if(error.code==='42501') advice+='\\n\\nRLS is blocking this request. Check the policies in supabase_schema.sql.';
     show('bad','Supabase is reachable, but the database request failed',advice);
     return;
   }
   show('ok','Supabase connection and database request work','Project URL:\\n'+c.url+'\\n\\nsite_settings row:\\n'+JSON.stringify(data,null,2));
 }catch(e){
   show('bad','Could not initialise Supabase',e.message||String(e));
 }
})();
</script></body></html>
